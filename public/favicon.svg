<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Newshound</title>
  <rect width="64" height="64" rx="14" fill="#3D6FD6"/>
  <!-- Hound head in profile, nose toward the signal -->
  <path fill="#FFFFFF" d="M13 56 C11 44 11 33 16 25 C20 18 27 15 33 16 C37 17 39 19 41 21 L50 26 C53 27.5 54 30 53 32.5 C52 35 49.5 35.5 47 35 L40 34 C37 37 34 40 33 46 L33 56 Z"/>
  <!-- Floppy ear -->
  <path fill="#1E3A78" d="M23 19 C17 20 13.5 27 14 36 C14.5 44 18.5 49 22 48 C25.5 47 27.5 40 28.5 33 C29.5 26 28 20 23 19 Z"/>
  <!-- Eye -->
  <circle cx="35" cy="23.5" r="2.2" fill="#1E3A78"/>
  <!-- Nose -->
  <circle cx="51.2" cy="29.6" r="2.6" fill="#1E3A78"/>
  <!-- Signal waves -->
  <g fill="none" stroke="#F2B34C" stroke-width="3.6" stroke-linecap="round">
    <path d="M47 16 A8 8 0 0 1 54 21"/>
    <path d="M47 8.5 A14.5 14.5 0 0 1 58.5 17"/>
